name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

env:
  DOTNET_ROOT: /opt/homebrew/opt/dotnet@8/libexec

jobs:
  build:
    strategy:
      matrix:
        worktree: [combat, equipment, collection]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout worktree ${{ matrix.worktree }}
        run: |
          git fetch origin
          git worktree add ../et-worktree-${{ matrix.worktree }} origin/${{ matrix.worktree }} 2>/dev/null || \
          git worktree add ../et-worktree-${{ matrix.worktree }} ${{ matrix.worktree }} 2>/dev/null || \
          echo "Worktree may already exist or branch not found"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./et-worktree-${{ matrix.worktree }}/Unity/Assets/Scripts

      - name: Build Model
        run: dotnet build Unity/Assets/Scripts/Model/Model.csproj -c Release --no-restore
        working-directory: ./et-worktree-${{ matrix.worktree }}

      - name: Build Hotfix
        run: dotnet build Unity/Assets/Scripts/Hotfix/Hotfix.csproj -c Release --no-restore
        working-directory: ./et-worktree-${{ matrix.worktree }}

  server-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Server
        run: dotnet build DotNet/DotNet.csproj -c Release
        working-directory: ./

      - name: Run Config Export
        run: dotnet run --project Bin/Bin.csproj --AppType=ExcelExporter --Process=0 --Console=1
        working-directory: ./

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run dotnet format
        run: |
          dotnet tool install -g dotnet-format 2>/dev/null || true
          dotnet format --verify-no-changes --severity warn Unity/Assets/Scripts/ || true
        continue-on-error: true
